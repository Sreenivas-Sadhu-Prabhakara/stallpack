<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1E2630; }
  body { display: grid; place-items: center; }
  /* 12% safe padding per side — mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- one bold awning scallop over a tally — count under the awning -->
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M4 5h24v5.5a6 6 0 0 1-12 0 6 6 0 0 1-12 0z" fill="#D2601A"/>
    <g stroke="#F5F3EE" stroke-width="2.4" stroke-linecap="round">
      <path d="M9.5 18v9"/><path d="M14 18v9"/><path d="M18.5 18v9"/><path d="M23 18v9"/>
      <path d="M7 26.5 25.5 18.5"/>
    </g>
  </svg>
</body>
</html>
